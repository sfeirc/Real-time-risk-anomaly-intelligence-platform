name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    strategy:
      fail-fast: false # independent services; one failing shouldn't hide the others' results
      matrix:
        service: [ingestion, feature-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config libssl-dev libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    strategy:
      fail-fast: false
      matrix:
        service: [data-generator, ml-inference, api-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app $([ -d scripts ] && echo scripts)
      - run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate every schema is well-formed JSON Schema
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          from jsonschema.validators import validator_for

          failed = False
          for path in sorted(Path('schemas').glob('*.schema.json')):
              schema = json.loads(path.read_text())
              validator_cls = validator_for(schema)
              try:
                  validator_cls.check_schema(schema)
                  print(f'OK   {path}')
              except Exception as e:
                  print(f'FAIL {path}: {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "

  schema-registry:
    # Proves BACKWARD-compatibility enforcement against a real schema
    # registry on every PR, not just that scripts/schema_registry.py runs -
    # see the script's docstring and docs/data-contracts.md. A GitHub Actions
    # `services:` container can't override Redpanda's default command, so
    # this starts it directly with `docker run` instead (same flags the
    # schema registry needs as docker-compose's `redpanda` service).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Start a single-node Redpanda with schema registry enabled
        run: |
          docker run -d --name redpanda -p 8081:8081 \
            redpandadata/redpanda:v24.2.18 \
            redpanda start --schema-registry-addr 0.0.0.0:8081 --kafka-addr 0.0.0.0:9092 \
              --rpc-addr 0.0.0.0:33145 --mode dev-container --smp 1 --memory 1G --default-log-level=warn
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && exit 0
            sleep 2
          done
          echo "redpanda did not become healthy in time" && docker logs redpanda && exit 1
      - run: python scripts/schema_registry.py register-all --url http://localhost:8081
      - run: python scripts/schema_registry.py check-all --url http://localhost:8081
      - name: Prove BACKWARD compatibility actually rejects a breaking change
        run: python scripts/schema_registry.py self-test --url http://localhost:8081

  security-audit:
    # Dependency vulnerability scanning on every PR, not a one-off manual
    # check - this is what actually caught PyJWT 2.10.1's real CVEs (fixed
    # in 2.13.0) during development; without a recurring job, the next
    # dependency bump could silently reintroduce something just as real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/ingestion
            services/feature-service
      - run: cargo install cargo-audit --locked
      - name: Audit ingestion (Rust)
        run: cargo audit
        working-directory: services/ingestion
      - name: Audit feature-service (Rust)
        run: cargo audit
        working-directory: services/feature-service
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit api-gateway (Python)
        run: pip-audit -r requirements.txt
        working-directory: services/api-gateway
      - name: Audit ml-inference (Python)
        # torch's +cpu wheel isn't on PyPI proper (see requirements.txt's
        # --extra-index-url), so pip-audit can't resolve that one exact
        # version string and prints it as a skip - verified this doesn't
        # affect the exit code (pip-audit only fails on an actual finding
        # among the packages it *could* resolve, not on an unresolvable one).
        run: pip-audit -r requirements.txt
        working-directory: services/ml-inference
      - name: Audit data-generator (Python)
        run: pip-audit -r requirements.txt
        working-directory: services/data-generator
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - name: Audit dashboard (npm)
        run: npm audit --audit-level=high
        working-directory: services/dashboard
