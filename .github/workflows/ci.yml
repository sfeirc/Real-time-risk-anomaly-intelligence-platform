name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    strategy:
      fail-fast: false # independent services; one failing shouldn't hide the others' results
      matrix:
        service: [ingestion, feature-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config libssl-dev libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    strategy:
      fail-fast: false
      matrix:
        service: [data-generator, ml-inference, api-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app $([ -d scripts ] && echo scripts)
      - run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate every schema is well-formed JSON Schema
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          from jsonschema.validators import validator_for

          failed = False
          for path in sorted(Path('schemas').glob('*.schema.json')):
              schema = json.loads(path.read_text())
              validator_cls = validator_for(schema)
              try:
                  validator_cls.check_schema(schema)
                  print(f'OK   {path}')
              except Exception as e:
                  print(f'FAIL {path}: {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "
