global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:9101"]

  - job_name: feature-service
    static_configs:
      - targets: ["feature-service:9102"]

  - job_name: ml-inference
    static_configs:
      - targets: ["ml-inference:9103"]

  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]
    metrics_path: /metrics

  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]
    metrics_path: /public_metrics

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
